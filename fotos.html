<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossas Fotos 💖</title>
<link rel="stylesheet" href="foto.css">
<style>

body{
    margin:0;
    background:#fff0f5;
    font-family:Arial;
    text-align:center;
    padding:40px;
}

h1{
    color:#e91e63;
    margin-bottom:40px;
}

.galeria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.galeria img{
    width:250px;
    height:320px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
    transition:0.3s;
}

.galeria img:hover{
    transform:scale(1.05);
}
 

</style>
</head>

<body>

<div class="fundo-flores"></div>

<div class="conteudo">
  
<h1>Parabéns Ana Neves❤️</h1>

<div class="galeria">

    <img src="fotos/foto-1.jpg">
    <img src="fotos/foto-2.jpg">
    <img src="fotos/foto-3.jpg">
    <img src="fotos/foto-4.jpg">
    <img src="fotos/foto-5.jpg">
    <img src="fotos/foto-6.jpg">
    <img src="fotos/foto-7.jpg">
    <img src="fotos/foto-8.jpg">

</div>

<script>

function criarPetala(){

    const petala = document.createElement("div");

    petala.classList.add("petala");

    const flores = ["✿","❀","🌸","❁"];

    petala.innerHTML =
    flores[Math.floor(Math.random()*flores.length)];

    petala.style.left = Math.random()*100 + "vw";

    petala.style.fontSize =
    Math.random()*20 + 15 + "px";

    petala.style.animationDuration =
    Math.random()*5 + 5 + "s";

    document.body.appendChild(petala);

    setTimeout(()=>{
        petala.remove();
    },10000);
}

setInterval(criarPetala,400);

</script>

</body>
</html>
